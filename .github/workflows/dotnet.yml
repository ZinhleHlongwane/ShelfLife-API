name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shelflife_test
          POSTGRES_USER: shelflife
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shelflife -d shelflife_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHELFLIFE_TEST_CONNECTION: Host=localhost;Port=5432;Database=shelflife_test;Username=shelflife;Password=local_dev_password
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ShelfLife.sln

      - name: Build solution
        run: dotnet build ShelfLife.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ShelfLife.sln --no-build --configuration Release
