name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ShelfLife.sln

      - name: Build solution
        run: dotnet build ShelfLife.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test ShelfLife.sln --no-build --configuration Release
