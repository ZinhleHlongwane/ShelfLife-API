services:
  postgres:
    image: postgres:17-alpine
    container_name: shelflife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shelflife
      POSTGRES_USER: shelflife
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - shelflife-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelflife -d shelflife"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shelflife-postgres-data:
